# SPDX-License-Identifier: LicenseRef-AnoSecureKit-Enterprise-Proprietary
name: AnoSecureKit Enterprise CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.build_type }} shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Release
            shared: 'OFF'
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            build_type: Release
            shared: 'OFF'
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Release
            shared: 'ON'
          - os: windows-latest
            compiler: msvc
            build_type: Release
            shared: 'ON'
          - os: macos-latest
            compiler: appleclang
            cc: clang
            cxx: clang++
            build_type: Release
            shared: 'OFF'

    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Qualification verifies historical audited commits are ancestors.
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: vcpkg install openssl:x64-windows

      - name: Configure Linux
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DANOSECUREKIT_ENTERPRISE_CRYPTO_BACKEND=openssl
          -DANOSECUREKIT_ENTERPRISE_USE_BUNDLED_COMMUNITY=ON
          -DANOSECUREKIT_ENTERPRISE_WARNINGS_AS_ERRORS=ON
          -DANOSECUREKIT_WARNINGS_AS_ERRORS=ON
          -DANOSECUREKIT_ENTERPRISE_TEST_PARALLEL_LEVEL=4

      - name: Configure macOS
        if: runner.os == 'macOS'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DANOSECUREKIT_ENTERPRISE_CRYPTO_BACKEND=openssl
          -DANOSECUREKIT_ENTERPRISE_USE_BUNDLED_COMMUNITY=ON
          -DANOSECUREKIT_ENTERPRISE_WARNINGS_AS_ERRORS=ON
          -DANOSECUREKIT_WARNINGS_AS_ERRORS=ON
          -DANOSECUREKIT_ENTERPRISE_TEST_PARALLEL_LEVEL=4
          -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DANOSECUREKIT_ENTERPRISE_CRYPTO_BACKEND=openssl
          -DANOSECUREKIT_ENTERPRISE_USE_BUNDLED_COMMUNITY=ON
          -DANOSECUREKIT_ENTERPRISE_WARNINGS_AS_ERRORS=ON
          -DANOSECUREKIT_WARNINGS_AS_ERRORS=ON
          -DANOSECUREKIT_ENTERPRISE_TEST_PARALLEL_LEVEL=4
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DANOSECUREKIT_OPENSSL_RUNTIME_DIR="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"

      - name: Run Enterprise release preflight (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --config ${{ matrix.build_type }} --target enterprise-release-preflight --parallel 4

      - name: Run Enterprise release preflight (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          cmake --build build --config ${{ matrix.build_type }} --target enterprise-release-preflight --parallel 4

      - name: Upload verified internal delivery artifacts
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: anosecurekit-enterprise-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-shared-${{ matrix.shared }}
          path: build/enterprise-delivery-check/delivery/*
          if-no-files-found: error
          retention-days: 14

  artifact-validation:
    name: downloaded-artifact-validation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Qualification verifies historical audited commits are ancestors.
          fetch-depth: 0

      - name: Download matrix artifacts
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: anosecurekit-enterprise-*
          path: downloaded-artifacts

      - name: Reverify downloaded artifacts
        shell: bash
        run: |
          for artifact in downloaded-artifacts/*; do
            cmake \
              -DENTERPRISE_SOURCE_DIR="$GITHUB_WORKSPACE" \
              -DARTIFACT_DIR="$artifact" \
              -DWORK_DIR="$RUNNER_TEMP/$(basename "$artifact")" \
              -DEXPECTED_SOURCE_REVISION="$GITHUB_SHA" \
              -P tests/package/check_downloaded_artifact.cmake
          done
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "source_revision=$GITHUB_SHA"
            find downloaded-artifacts -name SHA256SUMS.txt -print -exec cat {} \;
          } >> "$GITHUB_STEP_SUMMARY"

  attestation:
    name: artifact-attestation
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: artifact-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attestation-reference: ${{ steps.attest.outputs.attestation-url }}
      subject-list-digest: ${{ steps.subjects.outputs.digest }}
    steps:
      - name: Download verified matrix artifacts
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: anosecurekit-enterprise-*
          path: downloaded-artifacts

      - name: Bind artifact names and digests
        id: subjects
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            name=${file#downloaded-artifacts/}
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*(/[A-Za-z0-9][A-Za-z0-9._+-]*)*$ ]] || exit 1
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$name"
          done < <(find downloaded-artifacts -type f -print0 | sort -z) \
            | sort -k2 > attestation-subjects.sha256
          test -s attestation-subjects.sha256
          echo "digest=sha256:$(sha256sum attestation-subjects.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance attestation
        id: attest
        # actions/attest v4; official generic provenance action
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-checksums: attestation-subjects.sha256

      - name: Preserve immutable verification inputs
        shell: bash
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE_PATH" attestation-bundle.json

      - name: Upload attestation verification inputs
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: anosecurekit-enterprise-attestation-${{ github.sha }}
          path: |
            attestation-bundle.json
            attestation-subjects.sha256
          if-no-files-found: error
          retention-days: 14

  attestation-verification:
    name: artifact-attestation-verification
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: attestation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ATTESTATION_REFERENCE: ${{ needs.attestation.outputs.attestation-reference }}
      SUBJECT_LIST_DIGEST: ${{ needs.attestation.outputs.subject-list-digest }}
    steps:
      - name: Checkout exact source revision
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Qualification verifies historical audited commits are ancestors.
          fetch-depth: 0

      - name: Download verified matrix artifacts
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: anosecurekit-enterprise-*
          path: downloaded-artifacts

      - name: Download attestation verification inputs
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: anosecurekit-enterprise-attestation-${{ github.sha }}
          path: attestation-inputs

      - name: Verify attested artifact set
        shell: bash
        run: |
          [[ "$ATTESTATION_REFERENCE" =~ ^https://github.com/${GITHUB_REPOSITORY}/attestations/[1-9][0-9]*$ ]]
          echo "${SUBJECT_LIST_DIGEST#sha256:}  attestation-inputs/attestation-subjects.sha256" | sha256sum --check --strict
          while read -r digest name; do
            artifact="$GITHUB_WORKSPACE/downloaded-artifacts/$name"
            test -f "$artifact" && test ! -L "$artifact"
            cmake \
              "-DVERIFIER_EXECUTABLE=$(command -v gh)" \
              "-DARTIFACT_PATH=$artifact" \
              "-DEXPECTED_SUBJECT_NAME=$name" \
              "-DEXPECTED_SUBJECT_DIGEST=sha256:$digest" \
              "-DEXPECTED_SOURCE_REPOSITORY=$GITHUB_REPOSITORY" \
              "-DEXPECTED_SOURCE_REVISION=$GITHUB_SHA" \
              "-DEXPECTED_WORKFLOW_IDENTITY=$GITHUB_REPOSITORY/.github/workflows/anosecurekit-enterprise-ci.yml" \
              "-DEXPECTED_TRUST_DOMAIN=https://token.actions.githubusercontent.com" \
              "-DATTESTATION_REFERENCE=$ATTESTATION_REFERENCE" \
              "-DATTESTATION_BUNDLE=$GITHUB_WORKSPACE/attestation-inputs/attestation-bundle.json" \
              -DREQUIRE_VERIFIED=ON \
              -P cmake/check_release_evidence_verifier.cmake
          done < attestation-inputs/attestation-subjects.sha256

  codeql:
    name: CodeQL C/C++
    if: ${{ vars.ANOSECUREKIT_ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Qualification verifies historical audited commits are ancestors.
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build

      - name: Initialize CodeQL
        # github/codeql-action init v4
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: >
          cmake -S . -B build-codeql -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DANOSECUREKIT_ENTERPRISE_CRYPTO_BACKEND=openssl
          -DANOSECUREKIT_ENTERPRISE_USE_BUNDLED_COMMUNITY=ON
          -DANOSECUREKIT_ENTERPRISE_WARNINGS_AS_ERRORS=ON
          -DANOSECUREKIT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-codeql --target enterprise-check --parallel 4

      - name: Analyze
        # github/codeql-action analyze v4
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a

  sanitizers:
    name: ubuntu-latest clang Debug sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Qualification verifies historical audited commits are ancestors.
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev ninja-build

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build-sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DANOSECUREKIT_ENTERPRISE_CRYPTO_BACKEND=openssl
          -DANOSECUREKIT_ENTERPRISE_USE_BUNDLED_COMMUNITY=ON
          -DANOSECUREKIT_ENTERPRISE_WARNINGS_AS_ERRORS=ON
          -DANOSECUREKIT_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build and test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: >
          cmake --build build-sanitizers
          --target enterprise-sanitizer-check enterprise-profile-config-check enterprise-runtime-contract-check
          --parallel 4

  non-bundled-consumer:
    name: non-bundled-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Qualification verifies historical audited commits are ancestors.
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build

      - name: Build and install Community package
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S third_party/anosecurekit-community -B build-community -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANOSECUREKIT_BUILD_TESTS=OFF \
            -DANOSECUREKIT_BUILD_CLI=OFF \
            -DANOSECUREKIT_INSTALL_CLI=OFF \
            -DANOSECUREKIT_WARNINGS_AS_ERRORS=ON
          cmake --build build-community --parallel 4
          cmake --install build-community --prefix "$RUNNER_TEMP/anosecurekit-prefix"

      - name: Build, test, and install Enterprise against installed Community
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S . -B build-enterprise -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANOSECUREKIT_ENTERPRISE_USE_BUNDLED_COMMUNITY=OFF \
            -DANOSECUREKIT_ENTERPRISE_CRYPTO_BACKEND=openssl \
            -DANOSECUREKIT_ENTERPRISE_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/anosecurekit-prefix"
          cmake --build build-enterprise --target enterprise-check --parallel 4
          cmake --install build-enterprise --prefix "$RUNNER_TEMP/anosecurekit-prefix"

      - name: Build installed consumer
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S tests/package/consumer -B build-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/anosecurekit-prefix"
          cmake --build build-consumer --parallel 4
          ./build-consumer/anosecurekit_enterprise_installed_consumer
